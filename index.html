<!doctype html>
<html lang="pt" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>RIFFSPACE</title>
    <meta name="description" content="Perfil visual interativo para metalheads e guitarristas." />
    <script>
      // Aplica o tema guardado antes da primeira pintura (evita um flash do tema por omissão).
      // A validação completa do perfil acontece depois, na camada de persistência.
      try {
        var stored = JSON.parse(localStorage.getItem('riffspace:state') || 'null')
        var theme = stored && stored.profile && stored.profile.theme
        if (theme === 'obsidian' || theme === 'blood-moon' || theme === 'frozen-abyss') {
          document.documentElement.dataset.theme = theme
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
